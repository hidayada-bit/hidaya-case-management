<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d3b0f">
<link rel="apple-touch-icon" href="/HDA_LOGO.png">
<link rel="manifest" href="/manifest.json">
    <title>Hidaya Development Association</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f4ff; }
      #root { min-height: 100vh; }
      /* Night mode: invert the UI, then flip photos/paper back so they look natural */
      html.dark { filter: invert(1) hue-rotate(180deg); background: #fff; color-scheme: dark; }
      html.dark img, html.dark video, html.dark canvas, html.dark iframe, html.dark .no-invert { filter: invert(1) hue-rotate(180deg); }
      html.dark .no-invert img { filter: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
