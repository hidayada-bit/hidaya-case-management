<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d3b0f">
<link rel="apple-touch-icon" href="/HDA_LOGO.png">
<link rel="manifest" href="/manifest.json">
    <title>Hidaya Development Association</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f4ff; }
      #root { min-height: 100vh; }
      :root {
        --c-green:#1e7d22; --c-green-dark:#145717; --c-green-light:#e8f5e9; --c-green-mid:#2e9e33;
        --c-gold:#f5a800; --c-gold-dark:#c87d00; --c-gold-light:#fff8e1; --c-gold-mid:#ffb300;
        --c-sidebar:#0d3b0f; --c-sidebar-mid:#145717;
        --c-card:#ffffff; --c-input:#fafff9; --c-bg:#f0f7f0;
        --c-border:#c8e6c9; --c-text:#1a2e1a; --c-text-mid:#4a6b4a; --c-text-light:#7a9b7a;
      }
      /* Night mode: deep forest-green surfaces, soft off-white text */
      html.dark {
        color-scheme: dark;
        --c-green:#3aa23f; --c-green-dark:#9be0a0; --c-green-light:#1d3322; --c-green-mid:#4cb851;
        --c-gold:#f5a800; --c-gold-dark:#f2b84b; --c-gold-light:#33290f; --c-gold-mid:#ffb300;
        --c-sidebar:#08200a; --c-sidebar-mid:#0f3a12;
        --c-card:#14211a; --c-input:#0f1913; --c-bg:#0c1510;
        --c-border:#28402d; --c-text:#e4eee5; --c-text-mid:#a8c1aa; --c-text-light:#7d977f;
      }
      html.dark body { background: var(--c-bg); }
      html.dark ::placeholder { color: #6c836e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
